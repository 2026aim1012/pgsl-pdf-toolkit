name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      # Qt (PySide6) needs these system libraries on Linux, even with no
      # screen. Without them `import PySide6` fails, conftest.py can't load,
      # and pytest stops at once with exit code 4.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Run Ruff Lint
        if: success() || failure()
        run: uv run ruff check .

      - name: Run Ruff Format Check
        if: success() || failure()
        run: uv run ruff format --check .

      - name: Run Pytest
        if: success() || failure()
        env:
          QT_QPA_PLATFORM: offscreen # draw windows in memory, no screen needed
        run: uv run pytest tests/
