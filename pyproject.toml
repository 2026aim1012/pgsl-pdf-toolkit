[project]
name = "pgsl-pdf-toolkit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fpdf2>=2.8.9",
    "img2pdf>=0.6.3",
    "pikepdf>=10.13.0.post1",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "pyside6>=6.11.2",
    "qtawesome>=1.4.2",
    "rapidocr-onnxruntime>=1.4.4",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
pdf-toolkit = "pdf_toolkit.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_toolkit"]